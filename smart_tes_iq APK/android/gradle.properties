org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2G
# Proyek ada di drive D: sementara pub cache di C:. Kotlin incremental compiler
# gagal menghitung path relatif lintas-drive di Windows ("different roots")
# sehingga daemon compile-nya mati saat build release. Dimatikan agar build jalan.
kotlin.incremental=false
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
